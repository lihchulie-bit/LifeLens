
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>LifeLens is offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#071225;color:#f8fafc;font-family:Inter,system-ui,sans-serif}.card{width:min(560px,100%);padding:36px;border:1px solid #284264;border-radius:24px;background:#0c1b34;box-shadow:0 24px 70px rgba(0,0,0,.35);text-align:center}.logo{font-size:44px}.card h1{margin:14px 0 8px;font-size:32px}.card p{color:#b9c8dd;line-height:1.65}.card a,.card button{display:inline-flex;align-items:center;justify-content:center;margin:8px 4px 0;padding:12px 18px;border:0;border-radius:12px;background:#2563eb;color:#fff;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}.card .secondary{background:#162946;border:1px solid #38547b}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🧭</div>
    <h1>You’re offline</h1>
    <p>Your cached LifeLens pages and locally saved planner data may still be available. Reconnect to sync changes and use online AI features.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <a class="secondary" href="./planner.html">Open Planner</a>
  </main>
</body>
</html>
